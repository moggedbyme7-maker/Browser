<!DOCTYPE html>
<html lang="en" class="h-full dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Proxy by Mogger</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    colors: {
                        chrome: {
                            bgDark: '#1e1e22',
                            toolbarDark: '#28282d',
                            activeTabDark: '#323238',
                            accent: '#3b82f6'
                        }
                    }
                }
            }
        }
    </script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap');
        body { font-family: 'Inter', sans-serif; }
        code, pre { font-family: 'JetBrains Mono', monospace; }
        ::-webkit-scrollbar { width: 6px; height: 6px; }
        ::-webkit-scrollbar-track { background: transparent; }
        ::-webkit-scrollbar-thumb { background: rgba(156, 163, 175, 0.3); border-radius: 3px; }
        ::-webkit-scrollbar-thumb:hover { background: rgba(156, 163, 175, 0.5); }
    </style>
</head>
<body class="h-full bg-slate-900 text-slate-100 flex flex-col overflow-hidden select-none">

    <div class="bg-chrome-bgDark pt-2 px-2 flex items-center border-b border-zinc-800">
        <!-- Mac Window Decorations -->
        <div class="flex items-center space-x-2 px-2 mr-3">
            <span class="w-3 h-3 rounded-full bg-red-500 inline-block hover:opacity-80 cursor-pointer"></span>
            <span class="w-3 h-3 rounded-full bg-yellow-500 inline-block hover:opacity-80 cursor-pointer"></span>
            <span class="w-3 h-3 rounded-full bg-green-500 inline-block hover:opacity-80 cursor-pointer"></span>
        </div>

        <!-- Dynamic Tabs Container -->
        <div id="tabsContainer" class="flex items-center space-x-1 overflow-x-auto max-w-[calc(100vw-280px)] scrollbar-none">
            <!-- Tabs rendered dynamically via JavaScript -->
        </div>

        <!-- Add Tab Button -->
        <button id="newTabBtn" class="p-1.5 ml-1 text-slate-400 hover:bg-zinc-800 rounded-full transition-colors" title="New Tab">
            <i class="fa-solid fa-plus text-xs"></i>
        </button>

        <div class="ml-auto flex items-center space-x-2 pr-2">
            <button id="toggleDevToolsBtn" class="px-2.5 py-1 text-xs rounded-lg bg-zinc-800 hover:bg-zinc-700 text-slate-300 flex items-center space-x-1.5 border border-zinc-700 transition-colors">
                <i class="fa-solid fa-terminal text-blue-400"></i>
                <span>Console Logs</span>
            </button>
        </div>
    </div>

    <div class="bg-chrome-toolbarDark p-2 flex items-center space-x-2 shadow-sm border-b border-zinc-800">
        <!-- Navigation Buttons -->
        <button id="backBtn" class="p-2 text-slate-400 hover:bg-zinc-800 disabled:opacity-30 rounded-full transition-colors" title="Back">
            <i class="fa-solid fa-arrow-left text-sm"></i>
        </button>
        <button id="forwardBtn" class="p-2 text-slate-400 hover:bg-zinc-800 disabled:opacity-30 rounded-full transition-colors" title="Forward">
            <i class="fa-solid fa-arrow-right text-sm"></i>
        </button>
        <button id="reloadBtn" class="p-2 text-slate-400 hover:bg-zinc-800 rounded-full transition-colors" title="Reload">
            <i class="fa-solid fa-rotate-right text-sm"></i>
        </button>
        <button id="homeBtn" class="p-2 text-slate-400 hover:bg-zinc-800 rounded-full transition-colors" title="Speed Dial Home">
            <i class="fa-solid fa-house text-sm"></i>
        </button>

        <!-- Mode Selector -->
        <div class="relative">
            <select id="modeSelector" class="bg-zinc-900 border border-zinc-700 text-xs text-slate-200 py-1.5 px-2.5 rounded-lg focus:outline-none focus:ring-1 focus:ring-blue-500 cursor-pointer font-medium">
                <option value="proxy">⚡ Auto-Proxy (Failover)</option>
                <option value="direct">🌐 Direct Iframe</option>
            </select>
        </div>

        <!-- Address Bar Form -->
        <form id="urlForm" class="flex-1 flex items-center relative">
            <div class="absolute left-3 text-slate-500 text-xs flex items-center space-x-1.5">
                <i id="securityIcon" class="fa-solid fa-shield-halved text-emerald-400"></i>
            </div>
            <input id="urlInput" type="text" placeholder="Enter URL or search term (e.g. wikipedia.org)..."
                   class="w-full bg-zinc-900 text-slate-100 text-sm pl-8 pr-16 py-1.5 rounded-full border border-zinc-700 focus:outline-none focus:ring-2 focus:ring-blue-500 shadow-inner">
            <div class="absolute right-2 flex items-center space-x-1">
                <button type="submit" class="bg-blue-600 hover:bg-blue-700 text-white text-xs px-3 py-1 rounded-full font-medium transition-colors">
                    Go
                </button>
            </div>
        </form>

        <!-- External Tab Button -->
        <button id="externalOpenBtn" class="p-2 text-slate-400 hover:bg-zinc-800 rounded-full transition-colors" title="Open in Real Browser Tab">
            <i class="fa-solid fa-up-right-from-square text-sm"></i>
        </button>
    </div>

    <div id="statusBar" class="bg-zinc-950 px-4 py-1 text-xs text-slate-400 border-b border-zinc-800 flex items-center justify-between">
        <div class="flex items-center space-x-2">
            <span id="statusSpinner" class="hidden"><i class="fa-solid fa-circle-notch fa-spin text-blue-400"></i></span>
            <span id="statusText">Ready</span>
        </div>
        <div class="flex items-center space-x-4 text-[11px] text-slate-500">
            <span id="proxyUsedInfo">Proxy: None</span>
            <span id="linksHijackedInfo">Links Rewritten: 0</span>
        </div>
    </div>

    <div class="flex-1 relative bg-zinc-950 overflow-hidden flex">
        
        <!-- Speed Dial Home Screen -->
        <div id="speedDialView" class="absolute inset-0 z-10 overflow-y-auto p-6 flex flex-col items-center bg-zinc-950">
            <div class="max-w-4xl w-full flex flex-col items-center mt-6 mb-8">
                <div class="flex items-center space-x-3 mb-4">
                    <div class="w-12 h-12 rounded-2xl bg-gradient-to-tr from-blue-600 via-indigo-600 to-purple-600 flex items-center justify-center shadow-lg shadow-blue-500/20">
                        <i class="fa-solid fa-compass text-white text-2xl"></i>
                    </div>
                    <h1 class="text-3xl font-bold tracking-tight bg-gradient-to-r from-blue-400 via-indigo-400 to-purple-400 bg-clip-text text-transparent">
                        Nexus Browser | Made by Mogger!
                    </h1>
                </div>
                <p class="text-sm text-slate-400 mb-6 text-center max-w-lg">
                    A client-side browser emulator featuring multi-proxy failover, automatic link hijacking, and CSP/frame restriction neutralization.
                </p>

                <!-- Preset Speed Dial Grid -->
                <div class="w-full mt-4">
                    <h2 class="text-xs font-semibold uppercase tracking-wider text-slate-500 mb-3 px-1">
                        Popular Presets & Websites
                    </h2>
                    <div id="speedDialGrid" class="grid grid-cols-2 sm:grid-cols-3 md:grid-cols-4 gap-4">
                        <!-- Speed dial items rendered dynamically -->
                    </div>
                </div>
            </div>
        </div>

        <!-- Viewport Containers (Dynamic IFrames created per tab) -->
        <div id="viewportContainer" class="w-full h-full relative flex-1"></div>

        <!-- Console Log DevTools Panel -->
        <div id="devToolsPanel" class="hidden w-80 bg-zinc-900 border-l border-zinc-800 flex flex-col z-30">
            <div class="p-2.5 bg-zinc-950 border-b border-zinc-800 flex items-center justify-between text-xs font-semibold">
                <span class="flex items-center space-x-1.5">
                    <i class="fa-solid fa-terminal text-blue-400"></i>
                    <span>Proxy Console Logs</span>
                </span>
                <button id="clearLogsBtn" class="text-slate-500 hover:text-slate-300 text-[10px]">Clear</button>
            </div>
            <div id="logOutput" class="flex-1 p-3 font-mono text-[11px] overflow-y-auto space-y-2 text-slate-300"></div>
        </div>
    </div>

    <script>
        // Preset Speed Dial Bookmarks
        const PRESET_SITES = [
            { name: "Wikipedia", url: "https://www.wikipedia.org", icon: "fa-brands fa-wikipedia-w", color: "bg-slate-700" },
            { name: "Hacker News", url: "https://news.ycombinator.com", icon: "fa-brands fa-y-combinator", color: "bg-amber-600" },
            { name: "OpenStreetMap", url: "https://www.openstreetmap.org", icon: "fa-solid fa-map-location-dot", color: "bg-emerald-600" },
            { name: "W3Schools", url: "https://www.w3schools.com", icon: "fa-solid fa-code", color: "bg-green-700" },
            { name: "Archive.org", url: "https://archive.org", icon: "fa-solid fa-vault", color: "bg-zinc-700" },
            { name: "CodePen Trending", url: "https://codepen.io/popular", icon: "fa-brands fa-codepen", color: "bg-purple-600" },
            { name: "Bing Search", url: "https://www.bing.com", icon: "fa-brands fa-microsoft", color: "bg-blue-600" },
            { name: "DuckDuckGo HTML", url: "https://html.duckduckgo.com/html/", icon: "fa-solid fa-shield-halved", color: "bg-orange-600" }
        ];

        // CORS Proxy Endpoints Pool for Sequential Failover
        const PROXY_ENDPOINTS = [
            { id: "allorigins", name: "AllOrigins", format: (u) => `https://api.allorigins.win/raw?url=${encodeURIComponent(u)}` },
            { id: "corsproxy", name: "CorsProxy.io", format: (u) => `https://corsproxy.io/?${encodeURIComponent(u)}` },
            { id: "codetabs", name: "CodeTabs", format: (u) => `https://api.codetabs.com/v1/proxy?quest=${encodeURIComponent(u)}` }
        ];

        // Global State Management
        let tabs = [];
        let activeTabId = null;
        let logs = [];

        // DOM Elements References
        const tabsContainer = document.getElementById('tabsContainer');
        const newTabBtn = document.getElementById('newTabBtn');
        const urlForm = document.getElementById('urlForm');
        const urlInput = document.getElementById('urlInput');
        const backBtn = document.getElementById('backBtn');
        const forwardBtn = document.getElementById('forwardBtn');
        const reloadBtn = document.getElementById('reloadBtn');
        const homeBtn = document.getElementById('homeBtn');
        const modeSelector = document.getElementById('modeSelector');
        const speedDialView = document.getElementById('speedDialView');
        const speedDialGrid = document.getElementById('speedDialGrid');
        const viewportContainer = document.getElementById('viewportContainer');
        const devToolsPanel = document.getElementById('devToolsPanel');
        const toggleDevToolsBtn = document.getElementById('toggleDevToolsBtn');
        const logOutput = document.getElementById('logOutput');
        const clearLogsBtn = document.getElementById('clearLogsBtn');
        const statusSpinner = document.getElementById('statusSpinner');
        const statusText = document.getElementById('statusText');
        const proxyUsedInfo = document.getElementById('proxyUsedInfo');
        const linksHijackedInfo = document.getElementById('linksHijackedInfo');
        const externalOpenBtn = document.getElementById('externalOpenBtn');

        function addLog(msg, type = 'info') {
            const time = new Date().toLocaleTimeString();
            logs.push({ time, msg, type });
            const logEl = document.createElement('div');
            logEl.className = type === 'error' ? 'text-red-400' : (type === 'success' ? 'text-emerald-400' : 'text-slate-300');
            logEl.innerHTML = `<span class="text-slate-500">[${time}]</span> ${msg}`;
            logOutput.appendChild(logEl);
            logOutput.scrollTop = logOutput.scrollHeight;
        }

        function formatUrlInput(input) {
            let query = input.trim();
            if (!query) return '';
            // Handle search queries or valid URLs
            if (!query.includes('.') && !query.startsWith('http://') && !query.startsWith('https://')) {
                return `https://html.duckduckgo.com/html/?q=${encodeURIComponent(query)}`;
            }
            if (!query.startsWith('http://') && !query.startsWith('https://')) {
                return 'https://' + query;
            }
            return query;
        }

        function getHostname(urlStr) {
            try { return new URL(urlStr).hostname; } catch(e) { return urlStr || 'New Tab'; }
        }

        function processAndRewriteHtml(rawHtml, baseUrl) {
            const parser = new DOMParser();
            const doc = parser.parseFromString(rawHtml, 'text/html');

            // 1. Inject base tag for relative asset resolution (CSS, JS, Images)
            let baseEl = doc.querySelector('base');
            if (!baseEl) {
                baseEl = doc.createElement('base');
                if (doc.head) doc.head.insertBefore(baseEl, doc.head.firstChild);
            }
            baseEl.setAttribute('href', baseUrl);

            // 2. Remove CSP and X-Frame-Options meta tags
            doc.querySelectorAll('meta[http-equiv="Content-Security-Policy"], meta[http-equiv="X-Frame-Options"]').forEach(el => el.remove());

            // 3. Neutralize frame-busting scripts
            doc.querySelectorAll('script').forEach(script => {
                if (script.textContent && (script.textContent.includes('top.location') || script.textContent.includes('parent.location'))) {
                    script.textContent = script.textContent.replace(/top\.location/g, 'void_top_loc').replace(/parent\.location/g, 'void_parent_loc');
                }
            });

            // 4. Intercept link clicks inside iframe
            let hijackedCount = 0;
            doc.querySelectorAll('a[href]').forEach(anchor => {
                const href = anchor.getAttribute('href');
                if (href && !href.startsWith('javascript:') && !href.startsWith('#')) {
                    try {
                        const absoluteUrl = new URL(href, baseUrl).href;
                        anchor.setAttribute('data-nexus-url', absoluteUrl);
                        anchor.removeAttribute('target');
                        anchor.setAttribute('onclick', `
                            event.preventDefault();
                            window.parent.postMessage({ type: 'NEXUS_NAVIGATE', url: '${absoluteUrl}' }, '*');
                        `);
                        hijackedCount++;
                    } catch(e) {}
                }
            });

            // 5. Inject client bridge listener inside frame
            const bridgeScript = doc.createElement('script');
            bridgeScript.textContent = `
                document.addEventListener('click', function(e) {
                    let target = e.target.closest('a');
                    if (target && target.hasAttribute('data-nexus-url')) {
                        e.preventDefault();
                        const dest = target.getAttribute('data-nexus-url');
                        window.parent.postMessage({ type: 'NEXUS_NAVIGATE', url: dest }, '*');
                    }
                }, true);
            `;
            if (doc.head) doc.head.appendChild(bridgeScript);

            return {
                html: doc.documentElement.outerHTML,
                linksHijacked: hijackedCount
            };
        }

        async function fetchWithFailover(targetUrl) {
            let lastError = null;

            for (const proxy of PROXY_ENDPOINTS) {
                const proxiedUrl = proxy.format(targetUrl);
                addLog(`Attempting fetch via ${proxy.name}...`);
                
                try {
                    const response = await fetch(proxiedUrl);
                    if (!response.ok) throw new Error(`HTTP ${response.status} ${response.statusText}`);
                    
                    const text = await response.text();
                    if (!text || text.trim().length === 0) throw new Error("Empty response body");

                    addLog(`Successfully retrieved content via ${proxy.name}`, 'success');
                    return { html: text, proxyName: proxy.name };
                } catch (err) {
                    addLog(`Proxy ${proxy.name} failed: ${err.message}`, 'error');
                    lastError = err;
                }
            }

            throw lastError || new Error("All proxy attempts failed.");
        }

        function createTab(url = '') {
            const id = 'tab_' + Date.now();
            const tab = {
                id,
                title: url ? getHostname(url) : 'New Tab',
                url: url,
                mode: 'proxy',
                history: url ? [url] : [''],
                historyIndex: 0
            };

            tabs.push(tab);

            // Create corresponding IFrame viewport
            const iframe = document.createElement('iframe');
            iframe.id = `iframe_${id}`;
            iframe.className = 'w-full h-full border-none hidden';
            iframe.setAttribute('sandbox', 'allow-scripts allow-same-origin allow-forms allow-popups');
            viewportContainer.appendChild(iframe);

            switchTab(id);
            if (url) loadUrl(id, url);
        }

        function switchTab(id) {
            activeTabId = id;
            const tab = getActiveTab();

            tabs.forEach(t => {
                const frame = document.getElementById(`iframe_${t.id}`);
                if (frame) {
                    if (t.id === id) frame.classList.remove('hidden');
                    else frame.classList.add('hidden');
                }
            });

            if (!tab.url) {
                speedDialView.classList.remove('hidden');
                urlInput.value = '';
            } else {
                speedDialView.classList.add('hidden');
                urlInput.value = tab.url;
            }

            modeSelector.value = tab.mode || 'proxy';
            renderTabs();
            updateNavButtons();
        }

        function closeTab(id, e) {
            if (e) e.stopPropagation();
            if (tabs.length === 1) {
                // Reset sole remaining tab
                const tab = tabs[0];
                tab.url = '';
                tab.title = 'New Tab';
                tab.history = [''];
                tab.historyIndex = 0;
                const iframe = document.getElementById(`iframe_${tab.id}`);
                if (iframe) iframe.removeAttribute('srcdoc');
                switchTab(tab.id);
                return;
            }

            const index = tabs.findIndex(t => t.id === id);
            document.getElementById(`iframe_${id}`)?.remove();
            tabs = tabs.filter(t => t.id !== id);

            if (activeTabId === id) {
                switchTab(tabs[Math.max(0, index - 1)].id);
            } else {
                renderTabs();
            }
        }

        function renderTabs() {
            tabsContainer.innerHTML = '';
            tabs.forEach(tab => {
                const isActive = tab.id === activeTabId;
                const el = document.createElement('div');
                el.className = `flex items-center space-x-2 px-3 py-1.5 rounded-t-lg text-xs font-medium cursor-pointer max-w-[160px] min-w-[110px] select-none transition-all ${
                    isActive ? 'bg-chrome-activeTabDark text-slate-100 border-t-2 border-blue-500' : 'text-slate-400 hover:bg-zinc-800'
                }`;
                el.onclick = () => switchTab(tab.id);

                el.innerHTML = `
                    <i class="fa-solid fa-globe text-blue-400 text-xs"></i>
                    <span class="truncate flex-1">${tab.title || 'New Tab'}</span>
                    <button class="text-slate-500 hover:text-slate-200 text-xs p-0.5" onclick="closeTab('${tab.id}', event)">
                        <i class="fa-solid fa-xmark"></i>
                    </button>
                `;
                tabsContainer.appendChild(el);
            });
        }

        function getActiveTab() {
            return tabs.find(t => t.id === activeTabId) || tabs[0];
        }

        function updateNavButtons() {
            const tab = getActiveTab();
            backBtn.disabled = tab.historyIndex <= 0;
            forwardBtn.disabled = tab.historyIndex >= tab.history.length - 1;
        }

        async function loadUrl(tabId, inputUrl) {
            const tab = tabs.find(t => t.id === tabId);
            if (!tab) return;

            const targetUrl = formatUrlInput(inputUrl);
            if (!targetUrl) return;

            // Update tab metadata & history
            tab.url = targetUrl;
            tab.title = getHostname(targetUrl);
            if (tab.history[tab.historyIndex] !== targetUrl) {
                tab.history = tab.history.slice(0, tab.historyIndex + 1);
                tab.history.push(targetUrl);
                tab.historyIndex = tab.history.length - 1;
            }

            urlInput.value = targetUrl;
            speedDialView.classList.add('hidden');
            renderTabs();
            updateNavButtons();

            const iframe = document.getElementById(`iframe_${tabId}`);

            if (tab.mode === 'direct') {
                addLog(`Loading direct iframe src for: ${targetUrl}`);
                iframe.removeAttribute('srcdoc');
                iframe.src = targetUrl;
                statusText.textContent = 'Loaded directly';
                proxyUsedInfo.textContent = 'Proxy: Direct';
                linksHijackedInfo.textContent = 'Links Rewritten: N/A';
                return;
            }

            // Proxy Mode
            statusSpinner.classList.remove('hidden');
            statusText.textContent = `Fetching via Proxy Failover Engine...`;

            try {
                const { html: rawHtml, proxyName } = await fetchWithFailover(targetUrl);
                const { html: processedHtml, linksHijacked } = processAndRewriteHtml(rawHtml, targetUrl);

                proxyUsedInfo.textContent = `Proxy: ${proxyName}`;
                linksHijackedInfo.textContent = `Links Rewritten: ${linksHijacked}`;

                iframe.removeAttribute('src');
                iframe.srcdoc = processedHtml;
                statusText.textContent = 'Rendered successfully';
            } catch (err) {
                addLog(`All proxy attempts failed for ${targetUrl}: ${err.message}`, 'error');
                statusText.textContent = 'Proxy fetch failed';
                proxyUsedInfo.textContent = 'Proxy: Failed';

                // Display Clean Error Card inside Frame Area
                iframe.removeAttribute('src');
                iframe.srcdoc = `
                    <!DOCTYPE html>
                    <html>
                    <head>
                        <script src="https://cdn.tailwindcss.com"><\/script>
                        <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
                    </head>
                    <body class="bg-zinc-950 text-slate-200 h-screen flex flex-col items-center justify-center p-6 font-sans">
                        <div class="max-w-md w-full bg-zinc-900 border border-zinc-800 rounded-2xl p-6 text-center shadow-2xl">
                            <div class="w-12 h-12 bg-red-500/10 text-red-400 rounded-xl flex items-center justify-center mx-auto mb-4">
                                <i class="fa-solid fa-triangle-exclamation text-xl"></i>
                            </div>
                            <h2 class="text-xl font-bold mb-2 text-white">Page Couldn't Be Loaded</h2>
                            <p class="text-xs text-slate-400 mb-6">
                                Unable to fetch <code class="text-blue-400 font-mono">${targetUrl}</code> via public CORS proxy endpoints due to network restrictions or server rate limits.
                            </p>
                            <div class="flex flex-col gap-2">
                                <button onclick="window.parent.postMessage({type:'NEXUS_RETRY'}, '*')" class="w-full bg-blue-600 hover:bg-blue-700 text-white text-xs py-2 px-4 rounded-xl font-medium transition-colors">
                                    <i class="fa-solid fa-rotate-right mr-1.5"></i> Retry Fetch
                                </button>
                                <button onclick="window.parent.postMessage({type:'NEXUS_DIRECT'}, '*')" class="w-full bg-zinc-800 hover:bg-zinc-700 text-slate-200 text-xs py-2 px-4 rounded-xl font-medium border border-zinc-700 transition-colors">
                                    <i class="fa-solid fa-globe mr-1.5"></i> Try Direct Iframe
                                </button>
                                <button onclick="window.open('${targetUrl}', '_blank')" class="w-full bg-transparent hover:bg-zinc-800/50 text-slate-400 text-xs py-2 px-4 rounded-xl transition-colors">
                                    Open in New Browser Tab <i class="fa-solid fa-arrow-up-right-from-square ml-1 text-[10px]"></i>
                                </button>
                            </div>
                        </div>
                    </body>
                    </html>
                `;
            } finally {
                statusSpinner.classList.add('hidden');
            }
        }

        function renderSpeedDial() {
            speedDialGrid.innerHTML = '';
            PRESET_SITES.forEach(site => {
                const card = document.createElement('div');
                card.className = 'bg-zinc-900 border border-zinc-800 p-4 rounded-xl hover:border-blue-500 transition-all cursor-pointer flex flex-col items-center space-y-3 group';
                card.onclick = () => loadUrl(activeTabId, site.url);
                card.innerHTML = `
                    <div class="w-10 h-10 rounded-lg ${site.color} text-white flex items-center justify-center text-lg group-hover:scale-105 transition-transform">
                        <i class="${site.icon}"></i>
                    </div>
                    <span class="text-xs font-medium text-slate-300 truncate w-full text-center">${site.name}</span>
                `;
                speedDialGrid.appendChild(card);
            });
        }

        // Handle Messages from Embedded Frames
        window.addEventListener('message', (event) => {
            if (event.data?.type === 'NEXUS_NAVIGATE') {
                addLog(`Intercepted internal navigation to: ${event.data.url}`);
                loadUrl(activeTabId, event.data.url);
            } else if (event.data?.type === 'NEXUS_RETRY') {
                const tab = getActiveTab();
                if (tab.url) loadUrl(activeTabId, tab.url);
            } else if (event.data?.type === 'NEXUS_DIRECT') {
                const tab = getActiveTab();
                tab.mode = 'direct';
                modeSelector.value = 'direct';
                if (tab.url) loadUrl(activeTabId, tab.url);
            }
        });

        // Form Submission & Controls Listeners
        urlForm.addEventListener('submit', (e) => {
            e.preventDefault();
            loadUrl(activeTabId, urlInput.value);
        });

        newTabBtn.onclick = () => createTab();
        reloadBtn.onclick = () => { const t = getActiveTab(); if (t.url) loadUrl(activeTabId, t.url); };
        homeBtn.onclick = () => {
            const t = getActiveTab();
            t.url = '';
            urlInput.value = '';
            speedDialView.classList.remove('hidden');
        };

        backBtn.onclick = () => {
            const t = getActiveTab();
            if (t.historyIndex > 0) {
                t.historyIndex--;
                loadUrl(activeTabId, t.history[t.historyIndex]);
            }
        };

        forwardBtn.onclick = () => {
            const t = getActiveTab();
            if (t.historyIndex < t.history.length - 1) {
                t.historyIndex++;
                loadUrl(activeTabId, t.history[t.historyIndex]);
            }
        };

        modeSelector.onchange = (e) => {
            const tab = getActiveTab();
            tab.mode = e.target.value;
            if (tab.url) loadUrl(activeTabId, tab.url);
        };

        toggleDevToolsBtn.onclick = () => devToolsPanel.classList.toggle('hidden');
        clearLogsBtn.onclick = () => { logs = []; logOutput.innerHTML = ''; };
        externalOpenBtn.onclick = () => { const t = getActiveTab(); if (t.url) window.open(t.url, '_blank'); };

        // Initialize Application
        window.onload = () => {
            renderSpeedDial();
            createTab();
            addLog('Nexus Browser Simulator Engine Initialized', 'success');
        };
    </script>
</body>
</html>
